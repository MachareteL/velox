version: '3.8'

services:
  loki:
    image: grafana/loki:3.0.0
    container_name: velox-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100" # Exposto apenas para o localhost
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - logging-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: velox-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - ~/.pm2/logs:/root/.pm2/logs:ro
      - ./logs:/app/logs:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - logging-network

  grafana:
    image: grafana/grafana-enterprise:11.0.0
    container_name: velox-grafana
    restart: unless-stopped
    ports:
      - "3000:3000" # Porta visual do Grafana (protegida via Firewall UFW / Oracle Security List)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=VeloxLogsSecurity2026! # Altere esta senha em produção
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(port)s/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - logging-network

networks:
  logging-network:
    driver: bridge

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local

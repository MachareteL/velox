server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://velox-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pm2-worker-logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: velox-worker
          environment: production
          __path__: /app/logs/*.log

  - job_name: pm2-default-logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: velox-worker
          environment: production
          __path__: /root/.pm2/logs/velox-worker-*.log
